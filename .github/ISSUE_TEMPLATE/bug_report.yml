name: Bug report
description: Analysis or saving failed, or the result looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Please **do not attach your video or screenshots that show identifiable people**.
        The diagnostics from the app are enough (they contain no video content).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and operating system
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: input
    id: recording
    attributes:
      label: Recording
      description: Camera or phone, codec (H.264 or HEVC), resolution, number of files
      placeholder: Galaxy S24, H.264, 4K, 3 files
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the app open "Diagnostics", press "Copy", and paste it here.
      render: json
